<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Chloe — research assistant">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8B1538"/>
      <stop offset="1" stop-color="#5C0F28"/>
    </linearGradient>
    <linearGradient id="page" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fdf9f3"/>
      <stop offset="1" stop-color="#eaddca"/>
    </linearGradient>
    <radialGradient id="glass" cx="0.38" cy="0.34" r="0.75">
      <stop offset="0" stop-color="#6d1130"/>
      <stop offset="1" stop-color="#43091d"/>
    </radialGradient>
  </defs>

  <!-- burgundy rounded tile, matching the Abe/Barb family -->
  <rect x="0" y="0" width="512" height="512" rx="112" fill="url(#bg)"/>

  <!-- magnifying glass over an open book: research / study up close -->
  <g transform="translate(212 202)">
    <!-- handle -->
    <line x1="112" y1="112" x2="205" y2="205" stroke="#c9922f" stroke-width="40" stroke-linecap="round"/>
    <line x1="112" y1="112" x2="205" y2="205" stroke="#e8b84b" stroke-width="30" stroke-linecap="round"/>
    <line x1="118" y1="118" x2="196" y2="196" stroke="#f6d885" stroke-width="10" stroke-linecap="round"/>

    <!-- lens: dark tinted glass with a gold ring -->
    <circle cx="0" cy="0" r="150" fill="url(#glass)"/>
    <circle cx="0" cy="0" r="150" fill="none" stroke="#c9922f" stroke-width="30"/>
    <circle cx="0" cy="0" r="150" fill="none" stroke="#e8b84b" stroke-width="18"/>
    <!-- soft glass highlight -->
    <path d="M -96 -74 A 122 122 0 0 1 -6 -122" fill="none" stroke="#ffffff" stroke-width="12" stroke-linecap="round" opacity="0.18"/>

    <!-- open book, comfortably centered inside the lens -->
    <g transform="translate(0 4)">
      <!-- left page -->
      <path d="M0 -38 C -20 -48 -46 -48 -66 -40 L -66 40 C -46 32 -20 32 0 40 Z"
            fill="url(#page)" stroke="#cdb89c" stroke-width="3"/>
      <!-- right page -->
      <path d="M0 -38 C 20 -48 46 -48 66 -40 L 66 40 C 46 32 20 32 0 40 Z"
            fill="url(#page)" stroke="#cdb89c" stroke-width="3"/>
      <!-- spine -->
      <path d="M0 -38 L0 40" stroke="#b9a184" stroke-width="4" stroke-linecap="round" opacity="0.7"/>
      <!-- text lines -->
      <g stroke="#a98a68" stroke-width="6" stroke-linecap="round">
        <line x1="-50" y1="-18" x2="-16" y2="-14"/>
        <line x1="-50" y1="-2"  x2="-16" y2="2"/>
        <line x1="-50" y1="14"  x2="-24" y2="17"/>
        <line x1="16" y1="-14" x2="50" y2="-18"/>
        <line x1="16" y1="2"   x2="50" y2="-2"/>
        <line x1="24" y1="17"  x2="50" y2="14"/>
      </g>
    </g>
  </g>
</svg>
