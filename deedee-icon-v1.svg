<svg viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="DeeDee — a calendar">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8B1538"/>
      <stop offset="1" stop-color="#5C0F28"/>
    </linearGradient>
    <linearGradient id="page" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fffdf9"/>
      <stop offset="1" stop-color="#f0e4d6"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000000" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- full-bleed background (OS masks the corners into a rounded app icon) -->
  <rect width="512" height="512" fill="url(#bg)"/>

  <g filter="url(#soft)">
    <!-- calendar body -->
    <rect x="96" y="130" width="320" height="300" rx="26" fill="url(#page)" stroke="#4a0c20" stroke-width="8"/>
    <!-- header band -->
    <path d="M96 156 a26 26 0 0 1 26 -26 h268 a26 26 0 0 1 26 26 v42 h-320 z" fill="#8B1538"/>
    <line x1="96" y1="198" x2="416" y2="198" stroke="#4a0c20" stroke-width="6"/>

    <!-- binding rings -->
    <g fill="#f0e4d6" stroke="#4a0c20" stroke-width="6">
      <rect x="158" y="104" width="18" height="52" rx="9"/>
      <rect x="247" y="104" width="18" height="52" rx="9"/>
      <rect x="336" y="104" width="18" height="52" rx="9"/>
    </g>

    <!-- day grid dots -->
    <g fill="#c9a9b4">
      <circle cx="150" cy="248" r="15"/><circle cx="212" cy="248" r="15"/><circle cx="274" cy="248" r="15"/><circle cx="336" cy="248" r="15"/>
      <circle cx="150" cy="312" r="15"/><circle cx="212" cy="312" r="15"/>
    </g>

    <!-- highlighted "done" day with a check -->
    <circle cx="336" cy="312" r="30" fill="#2e7d54"/>
    <path d="M322 312 l9 10 l19 -22" fill="none" stroke="#ffffff" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- the "next" day, outlined -->
    <circle cx="274" cy="312" r="24" fill="none" stroke="#8B1538" stroke-width="7" stroke-dasharray="4 7"/>
  </g>

  <!-- name ribbon across the calendar -->
  <g filter="url(#soft)">
    <rect x="70" y="352" width="372" height="72" rx="16" fill="#8B1538" stroke="#fffdf9" stroke-width="5"/>
    <text x="256" y="403" text-anchor="middle"
          font-family="Georgia, 'Times New Roman', serif" font-size="46" font-weight="bold"
          letter-spacing="2" fill="#fffdf9">DeeDee</text>
  </g>
</svg>
