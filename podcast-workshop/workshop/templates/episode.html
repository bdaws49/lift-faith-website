<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{TITLE}} — {{SHOW_NAME}}</title>
<meta name="description" content="{{SUMMARY}}">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: 'Georgia', serif; background: linear-gradient(135deg,#8B1538 0%,#5C0F28 100%); min-height:100vh; padding:20px; }
  .container { background:#fff; border-radius:20px; box-shadow:0 20px 60px rgba(0,0,0,.3); max-width:900px; margin:0 auto; padding:60px 40px; }
  .header { text-align:center; margin-bottom:40px; }
  .eyebrow { display:inline-block; background:#f8f9ff; color:#8B1538; padding:8px 20px; border-radius:50px; font-size:.9rem; letter-spacing:1px; text-transform:uppercase; font-weight:bold; margin-bottom:20px; }
  .title { font-size:3.5rem; color:#8B1538; letter-spacing:2px; margin-bottom:10px; }
  .tagline { font-size:1.2rem; color:#555; font-style:italic; }
  .listen-group { display:flex; gap:15px; justify-content:center; flex-wrap:wrap; margin-top:30px; }
  .listen-btn { background:#8B1538; color:#fff; padding:16px 35px; border-radius:50px; font-size:1.1rem; font-weight:bold; text-decoration:none; transition:all .3s; }
  .listen-btn.secondary { background:transparent; color:#8B1538; border:2px solid #8B1538; }
  .section { margin:45px 0; }
  .section h2 { color:#8B1538; font-size:2rem; margin-bottom:25px; text-align:center; }
  .takeaway { font-size:1.15rem; line-height:1.8; color:#444; margin-bottom:18px; }
  .series-banner { background:linear-gradient(135deg,#8B1538 0%,#5C0F28 100%); color:#fff; padding:30px; border-radius:15px; text-align:center; margin:40px 0; }
  .series-banner h2 { color:#fff; font-size:1.5rem; margin-bottom:10px; }
  .quote-list { display:grid; gap:20px; margin-top:25px; }
  .quote-card { background:#f8f9ff; border-left:5px solid #8B1538; padding:25px 30px; border-radius:10px; }
  .quote-card p { font-size:1.2rem; line-height:1.7; color:#333; font-style:italic; }
  .quote-card .stamp { display:block; margin-top:12px; font-size:.9rem; color:#8B1538; font-weight:bold; font-style:normal; }
  .foundation { background:#f8f9ff; border-left:5px solid #8B1538; padding:30px; border-radius:10px; text-align:center; margin:40px 0; }
  .foundation h2 { color:#8B1538; margin-bottom:15px; }
  .foundation p { font-size:1.1rem; line-height:1.8; color:#333; }
  .foundation .verse { font-style:italic; color:#555; margin-top:15px; }
  @media (max-width:768px){ .container{padding:40px 22px;} .title{font-size:2.3rem;} .listen-group{flex-direction:column;} }
</style>
</head>
<body>
  <div class="container">
    <div class="header">
      <div class="eyebrow">{{SHOW_NAME}} · with {{SHOW_HOST}}</div>
      <h1 class="title">{{TITLE}}</h1>
      <p class="tagline">{{TAGLINE}}</p>
      <div class="listen-group">
        <a href="#" class="listen-btn">Listen on Spotify</a>
        <a href="#" class="listen-btn secondary">Listen on Apple</a>
        <a href="#" class="listen-btn secondary">Watch on YouTube</a>
      </div>
    </div>

    <div class="section">
      <h2>What This Episode Looks At</h2>
      <p class="takeaway">{{SUMMARY}}</p>
    </div>

    {{SERIES_BANNER}}

    <div class="section">
      <h2>Lines Worth Sitting With</h2>
      <div class="quote-list">
        {{QUOTE_CARDS}}
      </div>
    </div>

    <div class="foundation">
      <h2>The Text</h2>
      <p>{{SCRIPTURE_TEXT}}</p>
      <p class="verse">— {{SCRIPTURE_REF}}</p>
    </div>
  </div>
</body>
</html>
