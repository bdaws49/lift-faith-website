<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Publishing Dashboard — Barb</title>
<meta name="robots" content="noindex" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Barb" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="theme-color" content="#8B1538" />
<link rel="apple-touch-icon" href="/barb-apple-touch-v1.png" />
<link rel="icon" type="image/svg+xml" href="/barb-icon-v1.svg" />
<link rel="icon" type="image/png" sizes="192x192" href="/barb-icon-192-v1.png" />
<link rel="manifest" href="/barb-manifest.webmanifest" />
<style>
  :root {
    --burgundy: #8B1538;
    --burgundy-deep: #5C0F28;
    --cream: #f7f3ee;
    --ink: #2b2b2b;
    --muted: #6b6b6b;
    --line: #e7d9cc;
    --card: #ffffff;
    --ok: #2e7d54;
    --warn: #b8860b;
    --todo: #b0431f;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    font-family: Georgia, 'Times New Roman', serif;
    color: var(--ink);
    background: linear-gradient(160deg, #fbf8f4 0%, #f1e7ea 100%);
    min-height: 100dvh;
  }
  header {
    background: linear-gradient(135deg, var(--burgundy), var(--burgundy-deep));
    color: #fff; padding: 22px 20px; text-align: center;
    padding-top: calc(22px + env(safe-area-inset-top));
    box-shadow: 0 2px 10px rgba(0,0,0,.15);
  }
  header h1 { margin: 0; font-size: 1.5rem; letter-spacing: .3px; }
  header p { margin: 6px 0 0; font-size: .9rem; opacity: .92; font-style: italic; }
  header .meta { margin-top: 8px; font-size: .78rem; opacity: .8; font-style: normal; }

  main { max-width: 1080px; margin: 0 auto; padding: 22px 16px 60px; }

  /* summary strip */
  .summary { display: flex; flex-wrap: wrap; gap: 12px; margin-bottom: 22px; }
  .stat {
    flex: 1 1 140px; background: var(--card); border: 1px solid var(--line);
    border-radius: 12px; padding: 14px 16px; box-shadow: 0 1px 4px rgba(0,0,0,.05);
  }
  .stat .n { font-size: 1.7rem; color: var(--burgundy); font-weight: bold; }
  .stat .l { font-size: .78rem; text-transform: uppercase; letter-spacing: .6px; color: var(--muted); }

  /* book card */
  .book {
    background: var(--card); border: 1px solid var(--line); border-radius: 16px;
    padding: 20px 22px; margin-bottom: 20px; box-shadow: 0 2px 10px rgba(0,0,0,.06);
  }
  .book-head { display: flex; flex-wrap: wrap; align-items: baseline; gap: 10px 14px; margin-bottom: 4px; }
  .book-head h2 { margin: 0; font-size: 1.28rem; color: var(--burgundy-deep); }
  .book-head .fmt { font-size: .75rem; color: var(--muted); text-transform: uppercase; letter-spacing: .6px; }

  .pill {
    display: inline-block; font-size: .72rem; letter-spacing: .5px; text-transform: uppercase;
    padding: 4px 11px; border-radius: 999px; font-family: -apple-system, Arial, sans-serif; font-weight: 600;
  }
  .pipeline { display: flex; flex-wrap: wrap; gap: 5px; margin: 12px 0 18px; }
  .step {
    font-size: .68rem; padding: 3px 9px; border-radius: 999px; letter-spacing: .4px;
    font-family: -apple-system, Arial, sans-serif; background: #efe7de; color: #9a8f83;
  }
  .step.done { background: #e5efe9; color: var(--ok); }
  .step.current { background: var(--burgundy); color: #fff; }

  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 14px; }
  .field { border: 1px solid var(--line); border-radius: 11px; padding: 12px 14px; background: #fffdfb; }
  .field h3 {
    margin: 0 0 7px; font-size: .72rem; text-transform: uppercase; letter-spacing: .7px;
    color: var(--burgundy); font-family: -apple-system, Arial, sans-serif;
  }
  .field .v { font-size: .95rem; line-height: 1.45; }
  .field .sub { font-size: .82rem; color: var(--muted); margin-top: 3px; }
  .field ul { margin: 4px 0 0; padding-left: 18px; font-size: .88rem; }

  .bar { height: 8px; border-radius: 6px; background: #ece2d6; overflow: hidden; margin-top: 8px; }
  .bar > span { display: block; height: 100%; background: linear-gradient(90deg, var(--burgundy), #b81a47); }

  .tag-ok { color: var(--ok); font-weight: bold; }
  .tag-warn { color: var(--warn); font-weight: bold; }
  .tag-todo { color: var(--todo); font-weight: bold; }
  .path { font-family: ui-monospace, Menlo, monospace; font-size: .8rem; color: var(--muted); word-break: break-all; }

  footer { text-align: center; color: var(--muted); font-size: .82rem; padding: 10px 16px 30px; }
  footer a { color: var(--burgundy); }
  .empty, .error {
    background: var(--card); border: 1px solid var(--line); border-radius: 14px;
    padding: 26px; text-align: center; color: var(--muted);
  }
</style>
</head>
<body>
<header>
  <h1>Publishing Dashboard</h1>
  <p>Kept by Barb — every book, everything in one place.</p>
  <div class="meta" id="meta"></div>
</header>

<main>
  <div class="summary" id="summary"></div>
  <div id="books"><div class="empty">Loading books…</div></div>
</main>

<footer>
  Source of truth: <span class="path">barb/books.json</span> · edited by Barb.
  &nbsp;·&nbsp; <a href="/talk-to-abe">🎙️ Talk to Abe</a>
  &nbsp;·&nbsp; <a href="/talk-to-barb">📚 Talk to Barb</a>
  &nbsp;·&nbsp; <a href="/talk-to-chloe">🔎 Talk to Chloe</a>
  &nbsp;·&nbsp; <a href="/">Lift Faith home</a>
</footer>

<script>
const STATUS_FLOW = ["idea","drafting","editing","formatting","cover","pre-launch","launched","live"];

function esc(s){ return String(s==null?"":s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function statusColor(s){
  const i = STATUS_FLOW.indexOf(s);
  if (s === "live" || s === "launched") return {bg:"#e5efe9", fg:"#2e7d54"};
  if (i >= 4) return {bg:"#fdf1e3", fg:"#b8860b"};
  return {bg:"#f7e9ee", fg:"#8B1538"};
}
// mark a value done/warn/todo based on wording
function stateTag(v){
  const t = String(v||"").trim().toLowerCase();
  if (t === "" || t === "—" || /\b(todo|not started|pending)\b/.test(t)) return "tag-todo";
  if (/\b(draft|in progress|progress|awaiting|review)\b/.test(t)) return "tag-warn";
  if (/\b(approved|done|live|ready|complete|set)\b/.test(t)) return "tag-ok";
  return "";
}
function pct(a,b){ if(!b) return 0; return Math.max(0, Math.min(100, Math.round(100*a/b))); }

function pipeline(status){
  const cur = STATUS_FLOW.indexOf(status);
  return `<div class="pipeline">` + STATUS_FLOW.map((s,i)=>{
    const cls = i < cur ? "done" : (i === cur ? "current" : "");
    return `<span class="step ${cls}">${esc(s)}</span>`;
  }).join("") + `</div>`;
}

function field(title, inner){
  return `<div class="field"><h3>${esc(title)}</h3><div class="v">${inner}</div></div>`;
}

function renderBook(b){
  const sc = statusColor(b.status);
  const wc = b.wordCount || {};
  const wpct = pct(wc.current||0, wc.target||0);
  const lc = b.launch || {};
  const lpct = pct(lc.checklistDone||0, lc.checklistTotal||0);
  const cover = b.cover || {};
  const isbn = b.isbn || {};
  const kdp = b.kdp || {};
  const mk = b.marketing || {};
  const bn = b.bonuses || {};
  const rv = b.reviews || {};

  const kdpBits = [
    `Interior: <span class="${stateTag(kdp.interior)}">${esc(kdp.interior||"—")}</span>`,
    `Cover file: <span class="${stateTag(kdp.coverFile)}">${esc(kdp.coverFile||"—")}</span>`,
    `Metadata: <span class="${stateTag(kdp.metadata)}">${esc(kdp.metadata||"—")}</span>`
  ].join("<br>");

  const price = mk.price || {};
  const priceStr = [price.ebook!=null?`eBook $${esc(price.ebook)}`:null, price.print!=null?`print $${esc(price.print)}`:null].filter(Boolean).join(" · ") || "—";

  return `
  <div class="book">
    <div class="book-head">
      <h2>${esc(b.title||b.slug)}</h2>
      <span class="fmt">${esc(b.format||"")}${b.author?" · "+esc(b.author):""}</span>
      <span class="pill" style="background:${sc.bg};color:${sc.fg}">${esc(b.status||"—")}</span>
    </div>
    ${pipeline(b.status)}
    <div class="grid">
      ${field("Word count", `<strong>${(wc.current||0).toLocaleString()}</strong> / ${(wc.target||0).toLocaleString()} words
        <div class="bar"><span style="width:${wpct}%"></span></div>
        <div class="sub">${wpct}% to target</div>`)}
      ${field("Cover artwork", `<span class="${stateTag(cover.state)}">${esc(cover.state||"—")}</span>
        ${cover.notes?`<div class="sub">${esc(cover.notes)}</div>`:""}
        <div class="path">barb/books/${esc(b.slug)}/cover/</div>`)}
      ${field("ISBN", `eBook: <span class="${stateTag(isbn.ebook)}">${esc(isbn.ebook||"—")}</span><br>
        print: <span class="${stateTag(isbn.print)}">${esc(isbn.print||"—")}</span>`)}
      ${field("KDP files", `${kdpBits}<div class="path">${esc(kdp.path||("barb/books/"+b.slug+"/kdp/"))}</div>`)}
      ${field("Marketing", `Blurb: <span class="${stateTag(mk.blurb)}">${esc(mk.blurb||"—")}</span><br>
        Keywords: ${(mk.keywords||[]).length}/7 · Categories: ${(mk.categories||[]).length}<br>
        A+: <span class="${stateTag(mk.aPlusContent)}">${esc(mk.aPlusContent||"—")}</span><br>
        Price: ${priceStr}`)}
      ${field("Launch checklist", `<strong>${lc.checklistDone||0}</strong> / ${lc.checklistTotal||0} done
        <div class="bar"><span style="width:${lpct}%"></span></div>
        <div class="sub">${lc.target?("Target "+esc(lc.target)):"No date set"}</div>`)}
      ${field("Reader bonuses", `${(bn.items||[]).length ? "<ul>"+bn.items.map(i=>`<li>${esc(i)}</li>`).join("")+"</ul>" : "—"}
        <div class="sub">Hosted: <span class="${stateTag(bn.hostedAt)}">${esc(bn.hostedAt||"—")}</span></div>`)}
      ${field("Reviews to monitor", `Live: <strong>${rv.count!=null?esc(rv.count):"0"}</strong>${rv.avgRating!=null?` · ${esc(rv.avgRating)}★`:""}<br>
        ARC: ${esc(rv.arcCommitted!=null?rv.arcCommitted:0)}/${esc(rv.arcTarget!=null?rv.arcTarget:"—")} committed
        ${(rv.monitor||[]).length?`<div class="sub">Watch: ${rv.monitor.map(esc).join(" · ")}</div>`:""}`)}
    </div>
  </div>`;
}

function renderSummary(books){
  const total = books.length;
  const live = books.filter(b=>["live","launched"].includes(b.status)).length;
  const inProgress = total - live;
  const words = books.reduce((s,b)=>s+((b.wordCount&&b.wordCount.current)||0),0);
  const cards = [
    {n: total, l: "Books tracked"},
    {n: inProgress, l: "In progress"},
    {n: live, l: "Live / launched"},
    {n: words.toLocaleString(), l: "Words written"}
  ];
  return cards.map(c=>`<div class="stat"><div class="n">${c.n}</div><div class="l">${esc(c.l)}</div></div>`).join("");
}

// Load books: prefer the live Convex data (what Barb edits from the chat app);
// fall back to the static barb/books.json snapshot if Convex isn't reachable.
const CONVEX_URL = "https://tame-fennec-574.convex.cloud";

function withTimeout(p, ms){ return Promise.race([p, new Promise((_,rej)=>setTimeout(()=>rej(new Error("timeout")), ms))]); }

async function loadBooks(){
  try {
    const rows = await withTimeout((async () => {
      const mod = await import("https://esm.sh/convex@1.29.1/browser");
      const c = new mod.ConvexHttpClient(CONVEX_URL);
      return await c.query("books:list", {});
    })(), 3000);
    if (Array.isArray(rows) && rows.length) return { books: rows, source: "live" };
  } catch (e) { /* fall back to the static snapshot */ }
  const r = await fetch("/barb/books.json", {cache:"no-store"});
  if (!r.ok) throw new Error("HTTP " + r.status);
  const data = await r.json();
  return { books: data.books || [], source: "file" };
}

loadBooks()
  .then(({books, source}) => {
    books = books.slice().sort((a,b)=> STATUS_FLOW.indexOf(b.status)-STATUS_FLOW.indexOf(a.status));
    document.getElementById("summary").innerHTML = renderSummary(books);
    const updated = books.map(b=>b.updated).filter(Boolean).sort().pop();
    document.getElementById("meta").textContent = source === "live"
      ? ("🟢 Live" + (updated ? " · updated " + updated : ""))
      : ("Last updated" + (updated ? " " + updated : ""));
    document.getElementById("books").innerHTML = books.length
      ? books.map(renderBook).join("")
      : `<div class="empty">No books yet. Ask Barb to "add a book" to get started.</div>`;
  })
  .catch(err => {
    document.getElementById("books").innerHTML =
      `<div class="error">Couldn't load the dashboard (${esc(err.message)}).<br>
       On the live site this loads automatically. Opening the file locally? Serve the folder over http (e.g. <span class="path">npx serve</span>) — browsers block fetch on file://.</div>`;
  });
</script>
</body>
</html>
