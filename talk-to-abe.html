<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Talk to Abe — Under the Scope</title>
<meta name="robots" content="noindex" />
<!-- Make it feel like an app when added to an iPhone/iPad home screen -->
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Abe" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="theme-color" content="#8B1538" />
<!-- App icons -->
<link rel="apple-touch-icon" href="/abe-apple-touch-v1.png" />
<link rel="icon" type="image/png" sizes="192x192" href="/abe-icon-192-v1.png" />
<link rel="icon" type="image/png" sizes="64x64" href="/abe-favicon-v1.png" />
<link rel="manifest" href="/abe-manifest.webmanifest" />
<style>
  :root {
    --burgundy: #8B1538;
    --burgundy-deep: #5C0F28;
    --cream: #f7f3ee;
    --ink: #2b2b2b;
    --abe-bubble: #ffffff;
    --you-bubble: #8B1538;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    font-family: Georgia, 'Times New Roman', serif;
    color: var(--ink);
    background: linear-gradient(160deg, #fbf8f4 0%, #f1e7ea 100%);
    display: flex; flex-direction: column;
    min-height: 100dvh;
  }
  header {
    background: linear-gradient(135deg, var(--burgundy), var(--burgundy-deep));
    color: #fff; padding: 18px 20px; text-align: center;
    padding-top: calc(18px + env(safe-area-inset-top));
    box-shadow: 0 2px 10px rgba(0,0,0,.15);
  }
  header h1 { margin: 0; font-size: 1.35rem; letter-spacing: .3px; }
  header p { margin: 4px 0 0; font-size: .85rem; opacity: .9; font-style: italic; }
  .agent-nav { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin: 11px auto 0; }
  .agent-nav a { color: #fff; font-size: .76rem; text-decoration: none; opacity: .92;
    border: 1px solid rgba(255,255,255,.5); border-radius: 999px; padding: 4px 11px; }
  .agent-nav a:hover { background: rgba(255,255,255,.15); }
  .agent-nav a.current { background: rgba(255,255,255,.22); font-weight: bold; opacity: 1; }

  #chat {
    flex: 1; overflow-y: auto; padding: 18px 14px 8px;
    display: flex; flex-direction: column; gap: 12px;
    max-width: 720px; width: 100%; margin: 0 auto;
  }
  .msg { max-width: 82%; padding: 11px 15px; border-radius: 16px; line-height: 1.5;
         font-size: 1.02rem; white-space: pre-wrap; word-wrap: break-word; }
  .msg.abe { background: var(--abe-bubble); border: 1px solid #eaddd0;
             align-self: flex-start; border-bottom-left-radius: 4px;
             box-shadow: 0 1px 4px rgba(0,0,0,.06); }
  .msg.you { background: var(--you-bubble); color: #fff;
             align-self: flex-end; border-bottom-right-radius: 4px; }
  .msg .who { display: block; font-size: .72rem; text-transform: uppercase;
              letter-spacing: .8px; opacity: .7; margin-bottom: 3px; }
  .msg.you .who { color: #f3d9e0; }

  .typing { font-style: italic; opacity: .7; }

  footer {
    background: rgba(255,255,255,.75); backdrop-filter: blur(6px);
    border-top: 1px solid #e7d9cc; padding: 12px 14px 16px;
    padding-bottom: calc(16px + env(safe-area-inset-bottom));
  }
  .controls { max-width: 720px; margin: 0 auto; display: flex; flex-direction: column; gap: 10px; }
  .mic-row { display: flex; align-items: center; justify-content: center; gap: 14px; }
  #micBtn {
    width: 78px; height: 78px; border-radius: 50%; border: none; cursor: pointer;
    background: linear-gradient(135deg, var(--burgundy), var(--burgundy-deep));
    color: #fff; font-size: 2rem; box-shadow: 0 4px 14px rgba(139,21,56,.4);
    transition: transform .1s ease, box-shadow .2s ease; display: grid; place-items: center;
  }
  #micBtn:active { transform: scale(.94); }
  #micBtn.listening { animation: pulse 1.2s infinite; background: #b81a47; }
  @keyframes pulse { 0%,100% { box-shadow: 0 0 0 0 rgba(184,26,71,.5);} 50% { box-shadow: 0 0 0 16px rgba(184,26,71,0);} }
  .mic-hint { font-size: .82rem; color: var(--burgundy-deep); min-height: 1.2em; text-align: center; }

  .type-row { display: flex; gap: 8px; }
  #textInput {
    flex: 1; padding: 12px 14px; border: 1px solid #d8c6b8; border-radius: 12px;
    font-family: inherit; font-size: 1rem; background: #fff;
  }
  #sendBtn {
    padding: 0 18px; border: none; border-radius: 12px; cursor: pointer;
    background: var(--burgundy); color: #fff; font-family: inherit; font-size: 1rem;
  }
  .opts { display: flex; align-items: center; justify-content: center; gap: 16px;
          font-size: .85rem; color: #6b5b52; }
  .opts label { cursor: pointer; user-select: none; }
  .opts button.link { background: none; border: none; color: var(--burgundy);
    text-decoration: underline; cursor: pointer; font-family: inherit; font-size: .85rem; }
  .banner { background: #fff4e5; border: 1px solid #f0d9b5; color: #7a5a1e;
    padding: 8px 12px; border-radius: 10px; font-size: .85rem; text-align: center;
    max-width: 720px; margin: 8px auto 0; }
  .msg .replay { margin-top: 8px; display: inline-flex; align-items: center; gap: 5px;
    background: none; border: 1px solid #e0cdbe; color: var(--burgundy); cursor: pointer;
    font-family: inherit; font-size: .8rem; line-height: 1; border-radius: 999px; padding: 5px 11px; }
  .msg .replay:hover { background: rgba(139,21,56,.07); }
</style>
</head>
<body>
  <header>
    <h1>Talk to Abe</h1>
    <p>Your ministry partner — Under the Scope with Pastor Billy Daws</p>
    <nav class="agent-nav">
      <a class="current" href="/abe" aria-current="page">🎙️ Abe</a>
      <a href="/chloe">🔎 Chloe</a>
      <a href="/barb">📚 Barb</a>
      <a href="/deedee">📅 DeeDee</a>
      <a href="/dashboard">📋 Dashboard</a>
    </nav>
  </header>

  <div id="chat" aria-live="polite"></div>

  <div id="banner" class="banner" hidden></div>

  <footer>
    <div class="controls">
      <div class="mic-row">
        <button id="micBtn" title="Hold a thought and tap to talk" aria-label="Tap to talk">🎤</button>
      </div>
      <div id="micHint" class="mic-hint">Tap the mic and talk — or type below.</div>
      <div class="type-row">
        <input id="textInput" type="text" placeholder="Type to Abe…" autocomplete="off" />
        <button id="sendBtn">Send</button>
      </div>
      <div class="opts">
        <label><input type="checkbox" id="speakToggle" checked /> Abe speaks aloud</label>
        <button class="link" id="stopBtn" hidden>⏹ Stop</button>
        <button class="link" id="clearBtn">Start over</button>
      </div>
    </div>
  </footer>

<script>
(function () {
  var chat = document.getElementById('chat');
  var micBtn = document.getElementById('micBtn');
  var micHint = document.getElementById('micHint');
  var textInput = document.getElementById('textInput');
  var sendBtn = document.getElementById('sendBtn');
  var speakToggle = document.getElementById('speakToggle');
  var clearBtn = document.getElementById('clearBtn');
  var stopBtn = document.getElementById('stopBtn');
  var banner = document.getElementById('banner');

  // Conversation history sent to the backend.
  var messages = [];
  var busy = false;

  var GREETING = "Hey Billy — good to see you. What are we putting under the scope today? Give me a passage, a theme, or a podcast, and let's build.";

  function showBanner(text) { banner.textContent = text; banner.hidden = false; }

  function addBubble(role, text) {
    var div = document.createElement('div');
    div.className = 'msg ' + (role === 'assistant' ? 'abe' : 'you');
    var who = document.createElement('span');
    who.className = 'who';
    who.textContent = role === 'assistant' ? 'Abe' : 'You';
    div.appendChild(who);
    div.appendChild(document.createTextNode(text));
    chat.appendChild(div);
    chat.scrollTop = chat.scrollHeight;
    return div;
  }

  // ---- Speech synthesis (Abe talks back — in a MAN'S voice) ----
  // Browsers default to whatever voice the device picks (often female on iOS).
  // We pick a male English voice by name, since the Web Speech API has no
  // gender field. Voices load asynchronously on iOS, so we also listen for
  // 'voiceschanged' and re-pick.
  var abeVoice = null;
  var MALE_PREF = ['aaron','daniel','arthur','gordon','oliver','tom','fred','rishi',
    'alex','nathan','reed','evan','eddy','ralph','albert','junior','rocko','grandpa',
    'google uk english male','google us english male','microsoft david','microsoft mark','microsoft guy'];
  var FEMALE_NAMES = ['samantha','karen','moira','tessa','nicky','martha','catherine',
    'fiona','victoria','allison','ava','susan','zoe','veena','kate','serena','stephanie',
    'joana','luciana','paulina','shelley','grandma','flo','sandy','female','woman'];

  function pickVoice() {
    if (!('speechSynthesis' in window)) return null;
    var voices = window.speechSynthesis.getVoices() || [];
    if (!voices.length) return null;
    var en = voices.filter(function (v) { return /^en/i.test(v.lang); });
    var pool = en.length ? en : voices;
    // 1) prefer a known male voice name
    for (var i = 0; i < MALE_PREF.length; i++) {
      var want = MALE_PREF[i];
      for (var j = 0; j < pool.length; j++) {
        if (pool[j].name.toLowerCase().indexOf(want) !== -1) return pool[j];
      }
    }
    // 2) otherwise any English voice that isn't a known female voice
    for (var k = 0; k < pool.length; k++) {
      var nm = pool[k].name.toLowerCase();
      var isFemale = false;
      for (var m = 0; m < FEMALE_NAMES.length; m++) {
        if (nm.indexOf(FEMALE_NAMES[m]) !== -1) { isFemale = true; break; }
      }
      if (!isFemale) return pool[k];
    }
    return pool[0] || null; // last resort
  }

  function ensureVoice() { if (!abeVoice) abeVoice = pickVoice(); return abeVoice; }

  if ('speechSynthesis' in window) {
    window.speechSynthesis.onvoiceschanged = function () { abeVoice = pickVoice(); };
    ensureVoice();
  }

  // Stop control shared by every playback path (ElevenLabs, greeting, browser TTS).
  var currentAudio = null;
  function showStop(on) { if (stopBtn) stopBtn.hidden = !on; }
  function stopSpeaking() {
    try { if ('speechSynthesis' in window) window.speechSynthesis.cancel(); } catch (e) {}
    if (currentAudio) { try { currentAudio.pause(); } catch (e) {} currentAudio = null; }
    try { greetingAudio.pause(); } catch (e) {}
    showStop(false);
  }

  // Speak a reply: try the ElevenLabs server voice, fall back to the device voice.
  function speak(text) {
    if (!speakToggle.checked) return;
    stopSpeaking();
    fetch('/api/tts', {
      method: 'POST', headers: { 'content-type': 'application/json' },
      body: JSON.stringify({ text: text, agent: 'abe' })
    })
      .then(function (r) { return r.ok ? r.blob() : null; })
      .then(function (blob) {
        if (!blob || blob.type.indexOf('audio') === -1) { speakBrowser(text); return; }
        var a = new Audio(URL.createObjectURL(blob));
        currentAudio = a;
        a.addEventListener('ended', function () { showStop(false); });
        a.addEventListener('error', function () { showStop(false); speakBrowser(text); });
        showStop(true);
        a.play().catch(function () { showStop(false); speakBrowser(text); });
      })
      .catch(function () { speakBrowser(text); });
  }

  // Device (browser) voice — fallback when ElevenLabs isn't configured or errors.
  function speakBrowser(text) {
    if (!speakToggle.checked) return;
    if (!('speechSynthesis' in window)) return;
    try {
      window.speechSynthesis.cancel();
      var u = new SpeechSynthesisUtterance(text);
      var v = ensureVoice();
      if (v) { u.voice = v; u.lang = v.lang; }
      u.rate = 0.97; u.pitch = 0.92; // slightly lower = warmer, more masculine
      u.onend = function () { showStop(false); };
      showStop(true);
      window.speechSynthesis.speak(u);
    } catch (e) { showStop(false); }
  }

  // ---- Send to Abe ----
  function send(text) {
    text = (text || '').trim();
    if (!text || busy) return;
    busy = true;
    addBubble('user', text);
    messages.push({ role: 'user', content: text });
    textInput.value = '';

    var typing = addBubble('assistant', 'Abe is thinking…');
    typing.classList.add('typing');

    fetch('/api/abe', {
      method: 'POST',
      headers: { 'content-type': 'application/json' },
      body: JSON.stringify({ messages: messages })
    })
    .then(function (r) { return r.json().then(function (d) { return { ok: r.ok, d: d }; }); })
    .then(function (res) {
      typing.remove();
      if (!res.ok || res.d.error) {
        var msg = (res.d && res.d.error) ? res.d.error : 'Abe is unavailable right now.';
        addBubble('assistant', msg);
        return;
      }
      var reply = res.d.reply || '(no reply)';
      addBubble('assistant', reply);
      messages.push({ role: 'assistant', content: reply });
      speak(reply);
    })
    .catch(function () {
      typing.remove();
      addBubble('assistant', "I couldn't reach the server. If this is running locally, Abe needs to be deployed (with the AI key set) to answer.");
    })
    .finally(function () { busy = false; });
  }

  sendBtn.addEventListener('click', function () { send(textInput.value); });
  textInput.addEventListener('keydown', function (e) { if (e.key === 'Enter') send(textInput.value); });

  if (stopBtn) stopBtn.addEventListener('click', stopSpeaking);
  clearBtn.addEventListener('click', function () {
    messages = []; chat.innerHTML = '';
    stopSpeaking();
    showGreeting();
  });

  // ---- Speech recognition (you talk to Abe) ----
  var SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  var recog = null, listening = false;

  if (SR) {
    recog = new SR();
    recog.lang = 'en-US';
    recog.interimResults = false;
    recog.maxAlternatives = 1;

    recog.onstart = function () { listening = true; micBtn.classList.add('listening'); micHint.textContent = 'Listening… tap again to stop.'; };
    recog.onerror = function (e) { micHint.textContent = e.error === 'not-allowed' ? 'Microphone permission is off. Allow it in your browser, or just type.' : 'Didn’t catch that — try again or type.'; };
    recog.onend = function () { listening = false; micBtn.classList.remove('listening'); if (micHint.textContent.indexOf('Listening') === 0) micHint.textContent = 'Tap the mic and talk — or type below.'; };
    recog.onresult = function (e) {
      var said = e.results[0][0].transcript;
      send(said);
    };

    micBtn.addEventListener('click', function () {
      if (busy) return;
      stopSpeaking(); // stop any playback so the mic doesn't hear it
      if (listening) { recog.stop(); return; }
      try { recog.start(); } catch (e) {}
    });
  } else {
    micBtn.disabled = true;
    micBtn.style.opacity = '.5';
    micHint.textContent = 'Voice input works best in Chrome or on Android. You can type to Abe here.';
    showBanner('Tip: for talking out loud, open this page in Chrome or the Chrome app. Typing works everywhere.');
  }

  // ---- Pre-generated greeting in Abe's real voice (Higgsfield preset: Harrison) ----
  // Only the fixed greeting is pre-rendered; live replies use the device voice.
  var greetingAudio = new Audio('/abe-greeting-v2.mp3');
  greetingAudio.preload = 'auto';
  function playGreeting() {
    stopSpeaking();
    try { greetingAudio.currentTime = 0; } catch (e) {}
    currentAudio = greetingAudio;
    greetingAudio.onended = function () { showStop(false); };
    showStop(true);
    var p = greetingAudio.play();
    if (p && typeof p.catch === 'function') p.catch(function () { showStop(false); });
  }
  function showGreeting() {
    var g = addBubble('assistant', GREETING);
    var b = document.createElement('button');
    b.type = 'button'; b.className = 'replay';
    b.textContent = '🔊 Hear it';
    b.addEventListener('click', playGreeting);
    g.appendChild(document.createElement('br'));
    g.appendChild(b);
  }

  // Greeting
  showGreeting();
})();
</script>
</body>
</html>
